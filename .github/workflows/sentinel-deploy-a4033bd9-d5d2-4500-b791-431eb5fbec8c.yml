name: Deploy Content to Microsoft-Sentinel-Workspace [a4033bd9-d5d2-4500-b791-431eb5fbec8c]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-a4033bd9-d5d2-4500-b791-431eb5fbec8c.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-a4033bd9-d5d2-4500-b791-431eb5fbec8c.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'Microsoft-Sentinel-Resource-Group'
      workspaceName: 'Microsoft-Sentinel-Workspace'
      workspaceId: 'f6011c9f-0be6-45e0-a1a3-c36d1dc1972f'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule,AutomationRule,Playbook,Workbook,CustomDetection'
      branch: 'main'
      sourceControlId: 'a4033bd9-d5d2-4500-b791-431eb5fbec8c'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_a4033bd9d5d24500b791431eb5fbec8c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_a4033bd9d5d24500b791431eb5fbec8c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_a4033bd9d5d24500b791431eb5fbec8c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_a4033bd9d5d24500b791431eb5fbec8c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_a4033bd9d5d24500b791431eb5fbec8c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_a4033bd9d5d24500b791431eb5fbec8c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_a4033bd9d5d24500b791431eb5fbec8c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_a4033bd9d5d24500b791431eb5fbec8c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_a4033bd9d5d24500b791431eb5fbec8c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-a4033bd9-d5d2-4500-b791-431eb5fbec8c.ps1